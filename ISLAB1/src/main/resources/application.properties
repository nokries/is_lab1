spring.application.name=IS_LAB1
server.port=8080

# Подключение к БД. Значения по умолчанию - для локальной проверки.
# На Helios задаются переменными окружения (см. docs/03_RUN_AND_TEST.md):
#   DB_URL=jdbc:postgresql://pg:5432/studs  DB_USER=sNNNNNN  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Таблицы, последовательности и CHECK-ограничения создаёт schema.sql (ORM DDL не генерирует)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Небольшой пул соединений: на общем сервере pg у каждого студента ограничено число подключений
spring.datasource.hikari.maximum-pool-size=5
